  - id: "M2"
    title: "x402 Betalväxel, On-Chain Base RPC-Verifiering & Replay-Skydd"
    description: "Bygga HTTP 402 Payment Required middleware/dependency som både kan verifiera riktiga USDC-transaktioner på Base Mainnet via gratis publik RPC och stödja test-kvitton i lokalt testläge."
    priority: "CRITICAL"
    status: "TESTED"
    estimated_effort: "45 min"
    dependencies: ["M1"]
    challenge_pattern: "Kombinerar omedelbar x402-kompatibilitet med riktig on-chain verifiering mot Base Mainnet (https://mainnet.base.org) genom att kontrollera ERC-20 Transfer-loggar för USDC (0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913) till Johns plånboksadress, utan att kosta en krona i RPC-avgifter."
    tasks:
      - id: "T2.1"
        title: "Bygg x402 Payment Verifier & HTTP 402-svar"
        description: "Implementera kontroll av X-PAYMENT-PROOF header, on-chain verifiering mot Base RPC samt replay-spärr."
        status: "TESTED"
        acceptance_criteria:
          - "Anrop utan X-PAYMENT-PROOF ger HTTP 402 med komplett x402 JSON-specifikation (network: base-mainnet, token: USDC, amount, recipient)"
          - "När systemet är pausat (Nödstopp) returneras HTTP 503 Service Paused"
          - "Återanvänd tx_hash nekas med HTTP 402/409 (Replay-skydd)"
          - "Stödjer både skarp Base RPC-kontroll och simulerad verifiering för enhetstester"
        cost:
          estimated: "0 SEK"
          free_alternative: "Publik Base Mainnet RPC (https://mainnet.base.org)"
          requires_approval: false
          notes: "0 kr för läsanrop mot blockkedjan."
        steps:
          - id: "S2.1.1"
            action: "Skapa x402 betalningsmodul"
            details: "Implementera require_x402_payment och verify_base_usdc_transaction."
            file_or_location: "c:/Users/johnr/Documents/MDA/app/x402.py"
            estimated_time: "30 min"
            status: "TESTED"
    section_test:
      auto_test: true
      auto_fix: true
      test_strategy: "Kör enhetstester för saknad header (402), giltigt betalningsbevis (200), återanvänd tx_hash (nekas) och nödstopp (503)."
      notify_user: true

