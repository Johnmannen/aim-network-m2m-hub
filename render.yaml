services:
  - type: web
    name: aim-network-m2m-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WALLET_ADDRESS
        value: "0x1bbae07abebbb61f611391e02e81ee26b0c47b79"
      - key: ADMIN_PIN
        generateValue: true
      - key: SCOUT_SECRET_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: X402_VERIFY_MODE
        value: "strict_onchain"
      - key: TESTING
        value: "false"
      - key: MIN_CONFIRMATIONS
        value: "2"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SCOUT_AUTOPILOT_ENABLED
        value: "true"
      - key: SCOUT_INTERVAL_SECONDS
        value: "3600"
      - key: BASE_RPC_URL
        value: "https://mainnet.base.org"
      - key: BACKUP_GIST_ID
        sync: false
      - key: GITHUB_BACKUP_TOKEN
        sync: false
