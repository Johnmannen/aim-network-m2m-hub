services:
  - type: web
    name: aim-network-m2m-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WALLET_ADDRESS
        value: "0x1bbae07abebbb61f611391e02e81ee26b0c47b79"
      - key: ADMIN_PIN
        value: "2026"
      - key: X402_VERIFY_MODE
        value: "hybrid"
      - key: BASE_RPC_URL
        value: "https://mainnet.base.org"

