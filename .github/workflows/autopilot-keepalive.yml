name: AIM Network CI Tests & 24/7 Keep-Alive

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    # Körs var 10:e minut dygnet runt för att hålla Render Free Tier varm (<0.15s svarstid)
    # Obs: Anropar ENDAST /health och lokala manifest så vi inte spammar CoinGecko API!
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ci_tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run full pytest suite
        env:
          PYTHONPATH: "."
          TESTING: "true"
          X402_VERIFY_MODE: "hybrid"
          ADMIN_PIN: "ci_test_secret_pin_token"
        run: |
          python -m pytest tests -v

  keepalive_ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health & Sync Cloud Backup Gist
        env:
          GIST_PAT: ${{ secrets.GIST_BACKUP_TOKEN }}
        run: |
          echo "Pinging AIM Network on johngarp.click..."
          curl -fsS --max-time 25 "https://johngarp.click/health"
          echo ""
          curl -fsS --max-time 25 "https://johngarp.click/llms.txt" > /dev/null
          curl -fsS --max-time 25 "https://johngarp.click/agents.json" > /dev/null
          if [ -n "$GIST_PAT" ]; then
            curl -fsS --max-time 25 "https://johngarp.click/api/admin/backup-snapshot" -o snapshot.json
            python -c "import json, os, urllib.request; snap=open('snapshot.json','r',encoding='utf-8').read(); d=json.loads(snap); req=urllib.request.Request('https://api.github.com/gists/5a21a4697eacdb1311972b0a8c24e314', data=json.dumps({'files':{'aim_network_backup.json':{'content':snap}}}).encode('utf-8'), headers={'Authorization':'Bearer '+os.environ['GIST_PAT'],'Accept':'application/vnd.github+json','User-Agent':'aim-network-backup','Content-Type':'application/json'}, method='PATCH'); urllib.request.urlopen(req, timeout=15) if len(d.get('traffic_logs',[]))>0 else None"
          fi
