name: AIM Network CI Tests & 24/7 Keep-Alive

on:
  push:
    branches: [ "master", "main" ]
  schedule:
    # Körs var 10:e minut dygnet runt för att hålla Render Free Tier varm (<0.15s svarstid)
    # Obs: Anropar ENDAST /health och lokala manifest så vi inte spammar CoinGecko API!
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ci_tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run full pytest suite
        env:
          PYTHONPATH: "."
          TESTING: "true"
          X402_VERIFY_MODE: "hybrid"
          ADMIN_PIN: "ci_test_secret_pin_token"
          SCOUT_SECRET_TOKEN: "ci_test_secret_scout_token"
        run: |
          python -m pytest tests -v

  keepalive_ping:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Endpoints (Keep-Alive)
        run: |
          echo "Pinging AIM Network on johngarp.click..."
          curl -fsS -A "aim-keepalive" --max-time 25 "https://johngarp.click/health"
          echo ""
          curl -fsS -A "aim-keepalive" --max-time 25 "https://johngarp.click/llms.txt" > /dev/null
          curl -fsS -A "aim-keepalive" --max-time 25 "https://johngarp.click/agents.json" > /dev/null
